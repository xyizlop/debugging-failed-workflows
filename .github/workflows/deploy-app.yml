name: Deploy App

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build release
        id: build
        run: |
          mkdir -p release
          cp app.py release/
          echo "version=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Stop previous instance
        run: |
          [ -f app.pid ] && kill "$(cat app.pid)" 2>/dev/null || true
          rm -f app.pid

      - name: Start app
        run: |
          cd release
          APP_VERSION=${{ steps.build.outputs.version }} PORT=8000 \
            nohup python3 app.py > app.log 2>&1 &
          echo $! > ../app.pid

      - name: Wait for app to become healthy
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health > /dev/null && exit 0
            sleep 2
          done
          echo "App never became healthy"
          exit 1

      - name: Verify deployed version
        run: |
          actual=$(curl -s http://localhost:8000/health | python3 -c "import sys,json;print(json.load(sys.stdin)['version'])")
          [ "$actual" = "${{ steps.build.outputs.version }}" ] && echo "Verified: $actual"
